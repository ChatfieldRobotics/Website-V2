<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <defs>
        <!-- Glow Filter for Red Lights -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- Subtle Tech Grid Background -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#20242A" stroke-width="1.5" opacity="0.4"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#10151D" />
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- ================= BASE / BUMPER ================= -->
    <path d="M 80 380 Q 80 370 90 370 L 710 370 Q 720 370 720 380 L 720 440 Q 720 450 710 450 L 90 450 Q 80 450 80 440 Z" 
          fill="#20242A" stroke="#C62828" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Team Number -->
    <text x="400" y="430" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="52" 
          fill="#F5F5F5" text-anchor="middle" letter-spacing="10">9068</text>
    
    <!-- Bumper Accents -->
    <line x1="120" y1="395" x2="280" y2="395" stroke="#8E1717" stroke-width="3" stroke-linecap="round"/>
    <line x1="520" y1="395" x2="680" y2="395" stroke="#8E1717" stroke-width="3" stroke-linecap="round"/>

    <!-- ================= MAIN CHASSIS ================= -->
    <path d="M 120 370 L 120 180 Q 120 160 140 160 L 660 160 Q 680 160 680 180 L 680 370" 
          fill="none" stroke="#F5F5F5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Internal Frame Crossbars -->
    <line x1="120" y1="280" x2="680" y2="280" stroke="#20242A" stroke-width="10" stroke-linecap="round"/>
    <line x1="120" y1="300" x2="680" y2="300" stroke="#20242A" stroke-width="10" stroke-linecap="round"/>
    <line x1="280" y1="160" x2="280" y2="370" stroke="#20242A" stroke-width="8" stroke-linecap="round"/>
    <line x1="520" y1="160" x2="520" y2="370" stroke="#20242A" stroke-width="8" stroke-linecap="round"/>

    <!-- ================= TOP INTAKE / ROLLER ================= -->
    <!-- Slanted Front Panel -->
    <path d="M 120 180 L 120 120 Q 120 100 140 100 L 240 100 L 280 160 Z" 
          fill="#20242A" stroke="#F5F5F5" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Roller Mechanism -->
    <rect x="140" y="110" width="380" height="30" rx="15" fill="none" stroke="#D9A441" stroke-width="6"/>
    
    <!-- Roller Texture Segments -->
    <line x1="200" y1="110" x2="200" y2="140" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
    <line x1="260" y1="110" x2="260" y2="140" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
    <line x1="320" y1="110" x2="320" y2="140" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
    <line x1="380" y1="110" x2="380" y2="140" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
    <line x1="440" y1="110" x2="440" y2="140" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
    <line x1="500" y1="110" x2="500" y2="140" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>

    <!-- ================= ELECTRONICS / RED GLOW ================= -->
    <rect x="130" y="190" width="90" height="60" rx="10" fill="none" stroke="#8E1717" stroke-width="5"/>
    <circle cx="175" cy="220" r="18" fill="#C62828" filter="url(#glow)"/>
    <circle cx="175" cy="220" r="8" fill="#F5F5F5"/>
    
    <!-- Side Panel Accents -->
    <rect x="140" y="320" width="80" height="30" rx="6" fill="none" stroke="#D9A441" stroke-width="3"/>
    <text x="180" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#D9A441" text-anchor="middle">POWER</text>

    <!-- ================= CARGO / YELLOW BALLS ================= -->
    <g stroke="#D9A441" stroke-width="5" fill="none">
        <circle cx="560" cy="220" r="35" />
        <circle cx="620" cy="260" r="35" />
        <circle cx="580" cy="310" r="35" />
        <circle cx="510" cy="280" r="35" />
        <circle cx="480" cy="230" r="35" />
        <circle cx="630" cy="200" r="35" />
        <circle cx="550" cy="320" r="35" opacity="0.6" />
        <circle cx="660" cy="310" r="35" opacity="0.6" />
    </g>

    <!-- ================= BRANDING / DECALS ================= -->
    <!-- KLAANG Text -->
    <text x="620" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" 
          fill="#C62828" text-anchor="middle" letter-spacing="3">KLAANG</text>
    
    <!-- Comcast Abstract Logo -->
    <g transform="translate(560, 240)">
        <path d="M 0 10 L 10 0 L 20 10 L 10 20 Z" fill="#8E1717" />
        <text x="30" y="15" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14" 
              fill="#8E1717" letter-spacing="1">COMCAST</text>
    </g>

    <!-- ================= SLEEK TECH ACCENTS ================= -->
    <!-- Corner Brackets -->
    <path d="M 120 190 L 120 180 Q 120 160 140 160 L 150 160" fill="none" stroke="#D9A441" stroke-width="6" stroke-linecap="round"/>
    <path d="M 660 160 L 670 160 Q 680 160 680 180 L 680 190" fill="none" stroke="#D9A441" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Speed / Tech Lines -->
    <line x1="100" y1="340" x2="140" y2="340" stroke="#C62828" stroke-width="5" stroke-linecap="round"/>
    <line x1="660" y1="340" x2="700" y2="340" stroke="#C62828" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Base Slant Accents -->
    <path d="M 90 370 L 120 370" fill="none" stroke="#F5F5F5" stroke-width="4" stroke-linecap="round"/>
    <path d="M 680 370 L 710 370" fill="none" stroke="#F5F5F5" stroke-width="4" stroke-linecap="round"/>
</svg>